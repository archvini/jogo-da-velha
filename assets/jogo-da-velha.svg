<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title description">
  <title id="title">Jogo da Velha</title>
  <desc id="description">Previa colorida do jogo da velha com placar, status da partida e tabuleiro iluminado.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101b2c"/>
      <stop offset="1" stop-color="#0c2630"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1b2b3d"/>
      <stop offset="1" stop-color="#142433"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b6d6d3" stroke-opacity=".035"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope=".32"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="460" rx="22" fill="url(#background)"/>
  <rect width="1000" height="460" rx="22" fill="url(#grid)"/>
  <path d="M0 378C180 322 286 470 486 420S816 336 1000 382v78H0Z" fill="#0d3335" opacity=".55"/>
  <path d="M447 0h553v4H447z" fill="url(#green)" opacity=".85"/>

  <g font-family="Arial, sans-serif">
    <rect x="58" y="53" width="174" height="30" rx="15" fill="#173a37" stroke="#28614c"/>
    <circle cx="76" cy="68" r="4" fill="#4ade80"/>
    <text x="89" y="73" fill="#a7f3d0" font-size="12" font-weight="700" letter-spacing="1.1">DESAFIO CLASSICO</text>

    <text x="58" y="139" fill="#f1f5f9" font-size="46" font-weight="700">Jogo da</text>
    <text x="58" y="191" fill="#f1f5f9" font-size="46" font-weight="700">Velha<tspan fill="#4ade80">.</tspan></text>
    <text x="60" y="222" fill="#a8b8c6" font-size="17">Contra a CPU ou no modo local.</text>

    <g filter="url(#shadow)">
      <rect x="58" y="254" width="414" height="90" rx="14" fill="url(#panel)" stroke="#34495a"/>
    </g>
    <text x="80" y="281" fill="#8296a8" font-size="11" font-weight="700" letter-spacing="1.2">PLACAR DA PARTIDA</text>
    <path d="M195 293v34M320 293v34" stroke="#34495a"/>
    <text x="82" y="321" fill="url(#blue)" font-size="25" font-weight="700">X</text>
    <text x="112" y="321" fill="#f1f5f9" font-size="24" font-weight="700">3</text>
    <text x="222" y="321" fill="url(#pink)" font-size="25" font-weight="700">O</text>
    <text x="252" y="321" fill="#f1f5f9" font-size="24" font-weight="700">2</text>
    <text x="343" y="313" fill="#9aabba" font-size="12">EMPATES</text>
    <text x="343" y="333" fill="#f1f5f9" font-size="17" font-weight="700">1</text>

    <g filter="url(#shadow)">
      <rect x="58" y="365" width="178" height="48" rx="9" fill="url(#green)"/>
    </g>
    <path d="M80 388a8 8 0 1 1 2 5m-2-10v5h5" fill="none" stroke="#073b27" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="153" y="395" fill="#073b27" font-size="15" font-weight="700" text-anchor="middle">Nova partida</text>
    <text x="258" y="394" fill="#91a5b3" font-size="13">X vs CPU</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="526" y="37" width="416" height="388" rx="22" fill="url(#panel)" stroke="#405263"/>
  </g>
  <g font-family="Arial, sans-serif">
    <circle cx="558" cy="70" r="5" fill="#4ade80"/>
    <text x="573" y="75" fill="#c7d5de" font-size="13" font-weight="700" letter-spacing=".7">PARTIDA EM ANDAMENTO</text>
    <rect x="833" y="54" width="78" height="29" rx="14" fill="#173a37" stroke="#28614c"/>
    <text x="872" y="73" fill="#a7f3d0" font-size="11" font-weight="700" text-anchor="middle">VEZ DE X</text>
  </g>

  <g transform="translate(572 96)">
    <rect width="324" height="306" rx="14" fill="#111d2a" stroke="#263b4b" stroke-width="2"/>
    <g fill="#1d2c3b" stroke="#34495a" stroke-width="1.5">
      <rect x="8" y="8" width="96" height="90" rx="9"/>
      <rect x="114" y="8" width="96" height="90" rx="9"/>
      <rect x="220" y="8" width="96" height="90" rx="9"/>
      <rect x="8" y="108" width="96" height="90" rx="9"/>
      <rect x="114" y="108" width="96" height="90" rx="9"/>
      <rect x="220" y="108" width="96" height="90" rx="9"/>
      <rect x="8" y="208" width="96" height="90" rx="9"/>
      <rect x="114" y="208" width="96" height="90" rx="9"/>
      <rect x="220" y="208" width="96" height="90" rx="9"/>
    </g>
    <rect x="114" y="108" width="96" height="90" rx="9" fill="#203b45" stroke="#38bdf8" stroke-opacity=".6"/>
    <g fill="none" stroke-linecap="round" stroke-width="8" filter="url(#glow)">
      <path d="m35 31 42 42m0-42L35 73" stroke="url(#blue)"/>
      <circle cx="162" cy="53" r="22" stroke="url(#pink)"/>
      <path d="m247 31 42 42m0-42-42 42" stroke="url(#blue)"/>
      <circle cx="56" cy="153" r="22" stroke="url(#pink)"/>
      <path d="m141 131 42 42m0-42-42 42" stroke="url(#blue)"/>
      <circle cx="268" cy="153" r="22" stroke="url(#pink)"/>
      <path d="m35 231 42 42m0-42-42 42" stroke="url(#blue)"/>
      <circle cx="162" cy="253" r="22" stroke="url(#pink)"/>
    </g>
    <circle cx="268" cy="253" r="4" fill="#4ade80" filter="url(#glow)"/>
  </g>
</svg>